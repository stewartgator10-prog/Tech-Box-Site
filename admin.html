<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>CRM — Tech Box Solutions</title>
<link rel="icon" type="image/png" sizes="256x256" href="/assets/favicon-256.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --coal:#0C1622; --steel:#15202E; --iron:#24303F; --rust:#3B4A5C;
  --amber:#2AA5EA; --amber2:#57BEF8; --cream:#EAF2FA; --smoke:#8FA3B8; --chalk:#C3D2E1;
  --green:#6fcf97; --red:#eb5757; --blue:#2AA5EA; --violet:#9b8cff; --gold:#E8A830;
  --fd:'Barlow Condensed',sans-serif; --fb:'Barlow',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--coal);color:var(--chalk);font-family:var(--fb);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--fd);text-transform:uppercase;color:var(--cream);letter-spacing:.03em}
button{font-family:var(--fd);cursor:pointer}
a{color:var(--amber)}

/* ── LOGIN ── */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{background:var(--steel);border-top:3px solid var(--amber);padding:40px;width:100%;max-width:400px}
.login-card h1{font-size:1.8rem;font-weight:900;margin-bottom:6px}
.login-card .sub{color:var(--smoke);font-size:.9rem;margin-bottom:28px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
label{font-family:var(--fd);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--smoke)}
input,textarea,select{background:var(--coal);border:1px solid var(--iron);color:var(--cream);font-family:var(--fb);font-size:.95rem;padding:11px 13px;outline:none;width:100%;border-radius:0;appearance:none}
input:focus,textarea:focus,select:focus{border-color:var(--amber)}
textarea{resize:vertical;min-height:70px}
.btn{background:var(--amber);color:var(--coal);border:none;font-weight:800;font-size:14px;letter-spacing:.1em;text-transform:uppercase;padding:13px 20px;width:100%;transition:background .15s}
.btn:hover{background:var(--amber2)}
.btn-sm{width:auto;padding:8px 16px;font-size:12px}
.btn-ghost{background:transparent;border:1px solid var(--iron);color:var(--chalk)}
.btn-ghost:hover{border-color:var(--amber);color:var(--amber)}
.msg{margin-top:14px;font-family:var(--fd);font-size:13px;font-weight:700;letter-spacing:.05em;text-align:center;min-height:16px}
.msg.error{color:var(--red)} .msg.success{color:var(--green)}

/* ── APP ── */
#app{display:none}
.topbar{position:sticky;top:0;z-index:20;background:var(--coal);border-bottom:3px solid var(--amber);display:flex;align-items:center;justify-content:space-between;padding:14px 24px;flex-wrap:wrap;gap:12px}
.brand{font-family:var(--fd);font-weight:900;font-size:20px;letter-spacing:.06em;text-transform:uppercase;color:var(--cream)}
.brand small{display:block;font-size:10px;letter-spacing:.2em;color:var(--amber);font-weight:600}
.topbar-right{display:flex;align-items:center;gap:12px;font-size:.85rem;color:var(--smoke)}
.container{max-width:1200px;margin:0 auto;padding:24px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;background:var(--iron);margin-bottom:28px}
.stat{background:var(--steel);padding:20px 22px}
.stat-num{font-family:var(--fd);font-size:2.4rem;font-weight:900;color:var(--cream);line-height:1}
.stat-num.amber{color:var(--amber)}
.stat-label{font-family:var(--fd);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--smoke);margin-top:6px}

/* tabs */
.tabs{display:flex;gap:2px;background:var(--iron);margin-bottom:20px;flex-wrap:wrap}
.tab{background:var(--steel);border:none;color:var(--smoke);padding:11px 20px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.tab.active{background:var(--amber);color:var(--coal)}
.tab .count{opacity:.7;margin-left:6px}

/* contact rows */
.list{display:flex;flex-direction:column;gap:3px;background:var(--iron)}
.row{background:var(--steel)}
.row-head{display:grid;grid-template-columns:1.4fr 1.4fr 1fr auto;gap:16px;align-items:center;padding:16px 20px;cursor:pointer}
.row-head:hover{background:var(--iron)}
.rh-name{font-family:var(--fd);font-weight:800;font-size:1.05rem;color:var(--cream);text-transform:uppercase;letter-spacing:.02em}
.rh-sub{font-size:.82rem;color:var(--smoke)}
.rh-meta{font-size:.82rem;color:var(--smoke)}
.badge{font-family:var(--fd);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;white-space:nowrap}
.badge.lead{background:rgba(155,140,255,.15);color:var(--violet)}
.badge.qualified{background:rgba(232,168,48,.15);color:var(--gold)}
.badge.customer{background:rgba(111,207,151,.15);color:var(--green)}
.badge.lost{background:rgba(235,87,87,.12);color:var(--red)}
.row-body{display:none;padding:0 20px 22px;border-top:1px solid var(--iron)}
.row.open .row-body{display:block}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:18px 0}
.detail-block .dlabel{font-family:var(--fd);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--smoke);margin-bottom:4px}
.detail-block .dval{color:var(--chalk);font-size:.92rem;white-space:pre-wrap}
.controls{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:8px}
.controls .field{flex:1;min-width:150px;margin-bottom:0}
.inline-note{margin-top:14px}

/* projects */
.proj-section{margin-top:20px;border-top:1px solid var(--iron);padding-top:16px}
.proj-section h3{font-size:1rem;font-weight:800;margin-bottom:12px;color:var(--amber)}
.proj{display:grid;grid-template-columns:1.5fr 1fr auto auto;gap:12px;align-items:center;background:var(--coal);padding:12px 14px;margin-bottom:6px}
.proj-title{font-weight:600;color:var(--cream)}
.proj-desc{font-size:.8rem;color:var(--smoke)}
.pill{font-family:var(--fd);font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px}
.pill.open{background:rgba(42,165,234,.15);color:var(--blue)}
.pill.in_progress{background:rgba(232,168,48,.15);color:var(--gold)}
.pill.complete{background:rgba(111,207,151,.15);color:var(--green)}
.pill.on_hold{background:rgba(176,168,158,.15);color:var(--smoke)}
.pill.cancelled{background:rgba(235,87,87,.12);color:var(--red)}
.add-proj{display:grid;grid-template-columns:1.4fr 1.6fr .8fr auto;gap:10px;align-items:end;margin-top:12px}
.empty{color:var(--smoke);font-size:.9rem;padding:40px 20px;text-align:center}
.setup-warn{background:rgba(235,87,87,.1);border:1px solid var(--red);color:var(--cream);padding:16px 20px;margin-bottom:20px;font-size:.9rem}
.setup-warn code{color:var(--amber);font-family:monospace}

/* ── PROSPECTS ── */
.p-controls{display:grid;grid-template-columns:2fr repeat(5,1fr);gap:12px;margin-bottom:16px}
.p-controls .field{margin-bottom:0}
.p-count{font-family:var(--fd);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--smoke);margin-bottom:10px}
.prow-head{display:grid;grid-template-columns:56px 1.7fr 170px auto;gap:16px;align-items:center;padding:16px 20px;cursor:pointer}
.prow-head:hover{background:var(--iron)}
.pscore{font-family:var(--fd);font-size:2rem;font-weight:900;line-height:1;color:var(--cream);text-align:right}
.pscore.hot{color:var(--amber)}
.tick{font-family:var(--fd);font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--green);margin-left:8px;white-space:nowrap}
.bar{display:flex;height:6px;background:var(--coal);overflow:hidden}
.bar i{display:block;height:100%}
.bar .g{background:var(--amber)} .bar .t{background:var(--violet)}
.bar .p{background:var(--red)}   .bar .r{background:var(--blue)} .bar .d{background:var(--green)}
.tier{font-family:var(--fd);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--smoke);margin-top:6px}
.tier.flagged{color:var(--gold)}
.badge.identified{background:rgba(143,163,184,.14);color:var(--smoke)}
.badge.contacted{background:rgba(42,165,234,.15);color:var(--blue)}
.badge.confirmed{background:rgba(111,207,151,.15);color:var(--green)}
.badge.denied{background:rgba(235,87,87,.12);color:var(--red)}
.factors{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--iron);font-size:.8rem;color:var(--smoke)}
.factors b{color:var(--cream);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;margin-right:6px;vertical-align:middle}
.dval a{text-decoration:none}
.research-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--iron)}
.research-grid .field{margin-bottom:0}
.score-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}
.score-grid .field{margin-bottom:0}
.chk{display:flex;align-items:center;gap:8px;height:100%;padding-bottom:2px}
/* the global `appearance:none` on inputs hides the native tick — restore it */
.chk input{appearance:auto;-webkit-appearance:auto;width:auto;margin:0;accent-color:var(--amber)}
.chk span{font-size:.85rem;color:var(--chalk)}
.sect{font-family:var(--fd);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin-top:18px}
.hint{font-size:.78rem;color:var(--smoke);margin-top:10px}
.hint code{color:var(--amber);font-family:monospace;background:var(--coal);padding:2px 6px}

@media(max-width:800px){
  .stats{grid-template-columns:1fr 1fr}
  .row-head{grid-template-columns:1fr auto}
  .rh-meta{display:none}
  .detail-grid{grid-template-columns:1fr}
  .proj{grid-template-columns:1fr auto}
  .add-proj{grid-template-columns:1fr}
  .p-controls{grid-template-columns:1fr 1fr}
  .prow-head{grid-template-columns:48px 1fr auto}
  .prow-head .barwrap{grid-column:1/-1}
}
</style>
</head>
<body>

<!-- ── LOGIN ── -->
<div id="login">
  <div class="login-card">
    <img src="/assets/logo-icon-transparent.png" alt="Tech Box Solutions" width="84" height="84" style="display:block;width:84px;height:84px;margin-bottom:16px">
    <h1>Tech Box CRM</h1>
    <p class="sub">Sign in to manage leads, customers &amp; projects.</p>
    <div id="setup-warn-login"></div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" placeholder="you@techboxsolution.com">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="••••••••">
    </div>
    <button class="btn" id="login-btn">Sign In →</button>
    <div class="msg" id="login-msg"></div>
  </div>
</div>

<!-- ── APP ── -->
<div id="app">
  <div class="topbar">
    <div class="brand">Tech Box CRM<small>Leads · Customers · Projects</small></div>
    <div class="topbar-right">
      <span id="who"></span>
      <button class="btn btn-sm btn-ghost" id="refresh-btn">Refresh</button>
      <button class="btn btn-sm btn-ghost" id="logout-btn">Sign Out</button>
    </div>
  </div>

  <div class="container">
    <div class="stats" id="stats"></div>

    <div class="tabs" id="tabs">
      <button class="tab active" data-view="contacts" data-stage="all">All <span class="count" id="c-all">0</span></button>
      <button class="tab" data-view="contacts" data-stage="lead">Leads <span class="count" id="c-lead">0</span></button>
      <button class="tab" data-view="contacts" data-stage="qualified">Qualified <span class="count" id="c-qualified">0</span></button>
      <button class="tab" data-view="contacts" data-stage="customer">Customers <span class="count" id="c-customer">0</span></button>
      <button class="tab" data-view="contacts" data-stage="lost">Lost <span class="count" id="c-lost">0</span></button>
      <button class="tab" data-view="prospects">Prospects <span class="count" id="c-prospects">0</span></button>
    </div>

    <!-- inbound contacts -->
    <div id="contacts-view">
      <div class="list" id="list"></div>
      <div class="empty" id="empty" style="display:none">No contacts in this view yet.</div>
    </div>

    <!-- outbound prospects (businesses we found and scored) -->
    <div id="prospects-view" style="display:none">
      <div id="prospects-warn"></div>
      <div class="p-controls">
        <div class="field">
          <label for="p-q">Search</label>
          <input id="p-q" type="search" placeholder="Business, owner, address, findings…">
        </div>
        <div class="field">
          <label for="p-status">Status</label>
          <select id="p-status">
            <option value="">All statuses</option>
            <option value="identified">Identified</option>
            <option value="contacted">Contacted</option>
            <option value="confirmed">Confirmed</option>
            <option value="denied">Denied</option>
          </select>
        </div>
        <div class="field">
          <label for="p-cat">Category</label>
          <select id="p-cat"><option value="">All categories</option></select>
        </div>
        <div class="field">
          <label for="p-tier">Tier</label>
          <select id="p-tier">
            <option value="">All tiers</option>
            <option value="80">Call this week (80+)</option>
            <option value="65">Warm (65+)</option>
            <option value="50">Nurture (50+)</option>
          </select>
        </div>
        <div class="field">
          <label for="p-trading">Trading</label>
          <select id="p-trading">
            <option value="">Any</option>
            <option value="open">Open only</option>
            <option value="review">Confirm trading</option>
            <option value="closed">Closed</option>
          </select>
        </div>
        <div class="field">
          <label for="p-sort">Sort</label>
          <select id="p-sort">
            <option value="score">Score</option>
            <option value="name">Name</option>
            <option value="cat">Category</option>
          </select>
        </div>
      </div>
      <div class="p-count" id="p-count"></div>
      <div class="list" id="p-list"></div>
      <div class="empty" id="p-empty" style="display:none">Nothing matches those filters.</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ════════════════════════════════════════════════════════════════════════════
//  CONFIG — fill these in with your Supabase project's PUBLIC values.
//  Both are safe to expose in the browser: the anon key only grants what your
//  Row-Level Security policies allow (here: nothing until you're logged in).
//  Find them in Supabase → Project Settings → API.
// ════════════════════════════════════════════════════════════════════════════
const SUPABASE_URL      = 'https://osrdaywdwfbknibegohi.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_m5j8hfAkRvvwmMYAydj-ow_-sT1gl7p';

// ────────────────────────────────────────────────────────────────────────────
const configured = !SUPABASE_URL.startsWith('__') && !SUPABASE_ANON_KEY.startsWith('__');
let sb = null;
if (configured) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = (id) => document.getElementById(id);
let contacts = [];
let projectsByContact = {};
let prospects = [];
let prospectsError = null;
let activeStage = 'all';
let activeView  = 'contacts';   // 'contacts' | 'prospects'

const STAGES  = ['lead','qualified','customer','lost'];
const PSTATUS = ['open','in_progress','complete','on_hold','cancelled'];

// Prospect pipeline + the five scoring factors (see supabase-prospects-schema.sql).
const PROSPECT_STATUS = ['identified','contacted','confirmed','denied'];
const PRESENCE = ['none','social_only','abandoned_site','aggregator_only','has_site'];
const TRADING  = ['open','review','closed'];
const TRADING_LABEL = { open:'Open', review:'Confirm trading', closed:'Closed' };
const FACTORS = [
  ['gap_score',    'Gap',    30, 'g', 'var(--amber)'],
  ['ticket_score', 'Ticket', 25, 't', 'var(--violet)'],
  ['pain_score',   'Pain',   20, 'p', 'var(--red)'],
  ['reach_score',  'Reach',  15, 'r', 'var(--blue)'],
  ['demand_score', 'Demand', 10, 'd', 'var(--green)'],
];
const tierOf = (s) => s >= 80 ? 'Call this week' : s >= 65 ? 'Warm' : s >= 50 ? 'Nurture' : 'Park';
// A row that may not exist any more never reads as "call this week", however it scores.
const tierOfRow = (p) => p.trading_status === 'closed' ? 'Closed'
                       : p.trading_status === 'review' ? 'Confirm still trading'
                       : tierOf(p.total_score);
const esc = (s) => (s ?? '').toString().replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = (s) => new Date(s).toLocaleDateString('en-US',
  {month:'short',day:'numeric',year:'numeric'});

// ── SETUP GUARD ─────────────────────────────────────────────────────────────
if (!configured) {
  $('setup-warn-login').innerHTML =
    '<div class="setup-warn">⚠ Not configured yet. Open <code>admin.html</code> and set ' +
    '<code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code> near the top of the script.</div>';
  $('login-btn').disabled = true;
}

// ── AUTH ────────────────────────────────────────────────────────────────────
$('login-btn').addEventListener('click', signIn);
$('password').addEventListener('keydown', e => { if (e.key === 'Enter') signIn(); });
$('logout-btn').addEventListener('click', async () => { await sb.auth.signOut(); showLogin(); });
$('refresh-btn').addEventListener('click', loadAll);

async function signIn() {
  const email = $('email').value.trim();
  const password = $('password').value;
  const msg = $('login-msg');
  msg.className = 'msg'; msg.textContent = '';
  if (!email || !password) { msg.className='msg error'; msg.textContent='Enter email and password.'; return; }
  $('login-btn').disabled = true; $('login-btn').textContent = 'Signing in…';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  $('login-btn').disabled = false; $('login-btn').textContent = 'Sign In →';
  if (error) { msg.className='msg error'; msg.textContent = error.message; return; }
  showApp(data.user);
}

async function initSession() {
  if (!configured) return;
  const { data } = await sb.auth.getSession();
  if (data.session) showApp(data.session.user); else showLogin();
}

function showLogin(){ $('app').style.display='none'; $('login').style.display='flex'; }
function showApp(user){
  $('login').style.display='none'; $('app').style.display='block';
  $('who').textContent = user.email;
  loadAll();
}

// ── DATA ────────────────────────────────────────────────────────────────────
async function loadAll() {
  const [{ data: c, error: ce }, { data: p, error: pe }, { data: pr, error: pre }] = await Promise.all([
    sb.from('contacts').select('*').order('created_at', { ascending: false }),
    sb.from('projects').select('*').order('created_at', { ascending: false }),
    sb.from('prospects').select('*').order('total_score', { ascending: false }),
  ]);
  if (ce) { alert('Error loading contacts: ' + ce.message); return; }
  if (pe) { console.error(pe); }
  contacts = c || [];
  projectsByContact = {};
  (p || []).forEach(proj => {
    (projectsByContact[proj.contact_id] = projectsByContact[proj.contact_id] || []).push(proj);
  });

  // The prospects table is optional — the CRM still works before the migration
  // has been run, it just shows setup instructions on that tab.
  prospectsError = pre ? pre.message : null;
  if (pre) console.error(pre);
  prospects = pr || [];

  const cats = [...new Set(prospects.map(x => x.category).filter(Boolean))].sort();
  $('p-cat').innerHTML = '<option value="">All categories</option>' +
    cats.map(x => `<option value="${esc(x)}">${esc(x)}</option>`).join('');

  render();
}

function render() {
  renderStats();

  const by = (st) => contacts.filter(x => x.stage === st).length;
  $('c-all').textContent = contacts.length;
  STAGES.forEach(s => $('c-'+s).textContent = by(s));
  $('c-prospects').textContent = prospects.length;

  $('contacts-view').style.display  = activeView === 'contacts'  ? 'block' : 'none';
  $('prospects-view').style.display = activeView === 'prospects' ? 'block' : 'none';

  if (activeView === 'prospects') { renderProspects(); return; }

  const rows = contacts.filter(x => activeStage === 'all' || x.stage === activeStage);
  $('empty').style.display = rows.length ? 'none' : 'block';
  $('list').innerHTML = rows.map(renderRow).join('');
  wireRows();
}

function renderStats() {
  const cards = activeView === 'prospects'
    ? (() => {
        const byStatus = (s) => prospects.filter(x => x.status === s).length;
        const open = prospects.filter(x => x.trading_status === 'open');
        return [
          [open.filter(x => x.total_score >= 80).length, 'Call This Week', true],
          [open.filter(x => x.total_score >= 65 && x.total_score < 80).length, 'Warm', false],
          [byStatus('contacted'), 'Contacted', false],
          [prospects.filter(x => x.trading_status === 'review').length, 'Confirm Trading', false],
        ];
      })()
    : (() => {
        const by = (st) => contacts.filter(x => x.stage === st).length;
        const openProjects = Object.values(projectsByContact).flat()
          .filter(p => p.status === 'open' || p.status === 'in_progress').length;
        return [
          [by('lead'), 'New Leads', true],
          [by('qualified'), 'Qualified', false],
          [by('customer'), 'Open Customers', false],
          [openProjects, 'Open Projects', false],
        ];
      })();

  $('stats').innerHTML = cards.map(([n, label, amber]) =>
    `<div class="stat"><div class="stat-num${amber ? ' amber' : ''}">${n}</div>` +
    `<div class="stat-label">${label}</div></div>`).join('');
}

      <div>

      </div>
      <div class="rh-sub">${esc(c.email)}<br>${esc(c.phone || '')}</div>
      <div class="rh-meta">${esc(c.industry || '')}<br>${fmtDate(c.created_at)}</div>
      <span class="badge ${c.stage}">${c.stage}</span>
    </div>
    <div class="row-body">
      <div class="detail-grid">

          <div class="dlabel">What they need</div>

        </div>
        <div class="detail-block">

        <div class="detail-block" style="grid-column:1/-1">

      </div>

      <div class="controls">
        <div class="field">
          <label>Stage</label>

function renderProj(p) {
  return `
  <div class="proj" data-pid="${p.id}">
    <div>
      <div class="proj-title">${esc(p.title)}</div>
      <div class="proj-desc">${esc(p.description || '')}</div>
    </div>
    <select class="js-p-status">
      ${PSTATUS.map(s => `<option value="${s}" ${s===p.status?'selected':''}>${s.replace('_',' ')}</option>`).join('')}
    </select>
    <span class="proj-desc">${p.value != null ? '$'+Number(p.value).toLocaleString() : ''}</span>
    <button class="btn btn-sm btn-ghost js-del-proj">✕</button>
  </div>`;
}

// ── PROSPECTS ───────────────────────────────────────────────────────────────
function renderProspects() {
  if (prospectsError) {
    $('prospects-warn').innerHTML =
      '<div class="setup-warn">⚠ Prospects table not available yet — ' + esc(prospectsError) +
      '<br><br>Run <code>supabase-prospects-schema.sql</code> then ' +
      '<code>supabase-prospects-thurmont-seed.sql</code> in the Supabase SQL Editor. ' +
      'Steps are in <code>prospects-setup.md</code>.</div>';
  } else {
    $('prospects-warn').innerHTML = '';
  }

  const q     = $('p-q').value.trim().toLowerCase();
  const st    = $('p-status').value;
  const cat   = $('p-cat').value;
  const tier  = Number($('p-tier').value) || 0;
  const trad  = $('p-trading').value;
  const sort  = $('p-sort').value;

  const rows = prospects.filter(p => {
    if (st && p.status !== st) return false;
    if (cat && p.category !== cat) return false;
    if (trad && p.trading_status !== trad) return false;
    if (tier && p.total_score < tier) return false;
    if (q) {
      const hay = [p.business_name, p.owner_name, p.address, p.phone, p.category, p.findings, p.pitch]
        .filter(Boolean).join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  // Flagged rows sink below every open prospect regardless of score.
  const trade = (p) => p.trading_status === 'open' ? 0 : p.trading_status === 'review' ? 1 : 2;
  rows.sort((a, b) =>
    sort === 'name' ? a.business_name.localeCompare(b.business_name) :
    sort === 'cat'  ? (a.category || '').localeCompare(b.category || '') || b.total_score - a.total_score :
                      trade(a) - trade(b) || b.total_score - a.total_score
                      || a.business_name.localeCompare(b.business_name));

  $('p-count').textContent = `${rows.length} of ${prospects.length} shown`;
  $('p-empty').style.display = rows.length ? 'none' : 'block';
  $('p-list').innerHTML = rows.map(renderProspectRow).join('');
  wireProspectRows();
}

function renderProspectRow(p) {
  const bar = FACTORS.map(([key,,, cls]) => p[key] ? `<i class="${cls}" style="flex:${p[key]}"></i>` : '').join('')
            + (p.total_score < 100 ? `<i style="flex:${100 - p.total_score}"></i>` : '');

  const facts = FACTORS.map(([key, label, max,, color]) =>
    `<span><span class="dot" style="background:${color}"></span>${label} <b>${p[key]}</b>/${max}</span>`).join('');

  const meta = [p.category, p.address, p.owner_name].filter(Boolean).map(esc).join(' · ');
  const stars = p.rating != null
    ? `${p.rating} ★${p.review_count != null ? ` (${p.review_count} reviews)` : ''}`
    : 'No rating data';
  const lookup = `https://www.google.com/search?q=${encodeURIComponent(`${p.business_name} ${p.town || ''} ${p.state || ''}`.trim())}`;

  return `
  <div class="row" data-pid="${p.id}">
    <div class="prow-head">
      <div class="pscore${p.total_score >= 80 && p.trading_status === 'open' ? ' hot' : ''}">${p.total_score}</div>
      <div>
        <div class="rh-name">${esc(p.business_name)}${p.verified ? '<span class="tick" title="Checked by hand">✓ Verified</span>' : ''}${
          p.website ? `<span class="tick" style="color:var(--gold)" title="${esc(p.website)}">● Has site</span>` : ''}</div>
        <div class="rh-sub">${meta}</div>
      </div>
      <div class="barwrap">
        <div class="bar">${bar}</div>
        <div class="tier${p.trading_status !== 'open' ? ' flagged' : ''}">${esc(tierOfRow(p))}</div>
      </div>
      <span class="badge ${p.status}">${p.status}</span>
    </div>

    <div class="row-body">
      <div class="detail-grid">
        <div class="detail-block">
          <div class="dlabel">What we found</div>
          <textarea class="js-p-findings" rows="5">${esc(p.findings || '')}</textarea>
        </div>
        <div class="detail-block">
          <div class="dlabel">Recommended pitch</div>
          <textarea class="js-p-pitch" rows="5">${esc(p.pitch || '')}</textarea>
        </div>
      </div>

      <div class="research-grid">
        <div class="field">
          <label>Website (blank = none)</label>
          <input class="js-p-website" value="${esc(p.website || '')}" placeholder="https://…">
        </div>
        <div class="field">
          <label>Presence</label>
          <select class="js-p-presence">
            ${PRESENCE.map(v => `<option value="${v}" ${v === (p.presence_type || 'none') ? 'selected' : ''}>${v.replace(/_/g,' ')}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Owner / contact</label>
          <input class="js-p-owner" value="${esc(p.owner_name || '')}" placeholder="Who to ask for">
        </div>
        <div class="field">
          <label>Phone</label>
          <input class="js-p-phone" value="${esc(p.phone || '')}" placeholder="301-555-0100">
        </div>
        <div class="field">
          <label>Reviews</label>
          <input class="js-p-reviews" type="number" min="0" value="${p.review_count ?? ''}" placeholder="—">
        </div>
        <div class="field">
          <label>Rating</label>
          <input class="js-p-rating" type="number" min="0" max="5" step="0.1" value="${p.rating ?? ''}" placeholder="—">
        </div>
        <div class="field">
          <label>Verified</label>
          <label class="chk"><input type="checkbox" class="js-p-verified" ${p.verified ? 'checked' : ''}><span>Checked by hand</span></label>
        </div>
        <div class="field">
          <label>Still trading?</label>
          <select class="js-p-trading">
            ${TRADING.map(v => `<option value="${v}" ${v === (p.trading_status || 'open') ? 'selected' : ''}>${TRADING_LABEL[v]}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Last contacted</label>
          <div class="dval" style="padding-top:9px">${p.last_contacted_at ? fmtDate(p.last_contacted_at) : '—'}</div>
        </div>
      </div>

      <div class="sect">Score — ${stars}</div>
      <div class="score-grid">
        ${FACTORS.map(([key, label, max]) => `
        <div class="field">
          <label>${label} / ${max}</label>
          <input class="js-p-score" data-key="${key}" type="number" min="0" max="${max}" value="${p[key]}">
        </div>`).join('')}
      </div>

      <div class="factors">${facts}</div>

      <div class="controls" style="margin-top:18px">
        <div class="field">
          <label>Status</label>
          <select class="js-p-stage">
            ${PROSPECT_STATUS.map(s => `<option value="${s}" ${s === p.status ? 'selected' : ''}>${s}</option>`).join('')}
          </select>
        </div>
        <div class="field" style="flex:2">
          <label>Note</label>
          <input class="js-p-note" value="${esc(p.status_note || '')}" placeholder="Left voicemail, call back Tues…">
        </div>
        <button class="btn btn-sm js-p-save">Save</button>
        <a class="btn btn-sm btn-ghost" href="${esc(lookup)}" target="_blank" rel="noopener"
           style="text-decoration:none;text-align:center">Look Up</a>
      </div>

      <div class="hint">Deep-dive this one automatically: run <code>/prospect-research ${esc(p.business_name)}</code> in Claude Code.</div>
    </div>
  </div>`;
}

function wireProspectRows() {
  document.querySelectorAll('#p-list .row').forEach(row => {
    const id = row.dataset.pid;
    row.querySelector('.prow-head').addEventListener('click', () => row.classList.toggle('open'));

    row.querySelector('.js-p-save').addEventListener('click', async (e) => {
      const btn = e.target;
      const val = (sel) => row.querySelector(sel).value.trim();
      const orNull = (s) => s === '' ? null : s;
      const numOrNull = (s) => s === '' ? null : Number(s);

      const status = row.querySelector('.js-p-stage').value;
      const patch = {
        status,
        status_note:   row.querySelector('.js-p-note').value,
        findings:      orNull(val('.js-p-findings')),
        pitch:         orNull(val('.js-p-pitch')),
        website:       orNull(val('.js-p-website')),
        presence_type: val('.js-p-presence'),
        owner_name:    orNull(val('.js-p-owner')),
        phone:         orNull(val('.js-p-phone')),
        review_count:  numOrNull(val('.js-p-reviews')),
        rating:        numOrNull(val('.js-p-rating')),
        verified:      row.querySelector('.js-p-verified').checked,
        trading_status: val('.js-p-trading'),
      };
      // total_score is generated by the database — never send it.
      for (const input of row.querySelectorAll('.js-p-score')) {
        patch[input.dataset.key] = Number(input.value) || 0;
      }

      btn.textContent = 'Saving…'; btn.disabled = true;
      if (status === 'contacted' && prospects.find(p => p.id === id).status !== 'contacted') {
        patch.last_contacted_at = new Date().toISOString();
      }

      // select() returns the row with total_score recomputed by Postgres.
      const { data, error } = await sb.from('prospects').update(patch).eq('id', id).select().single();
      if (error) { alert('Could not save: ' + error.message); btn.textContent = 'Save'; btn.disabled = false; return; }

      Object.assign(prospects.find(p => p.id === id), data);
      btn.textContent = 'Saved ✓';
      renderStats();
      const score = row.querySelector('.pscore');
      score.textContent = data.total_score;
      score.className = 'pscore' + (data.total_score >= 80 && data.trading_status === 'open' ? ' hot' : '');
      const tier = row.querySelector('.tier');
      tier.textContent = tierOfRow(data);
      tier.className = 'tier' + (data.trading_status !== 'open' ? ' flagged' : '');
      row.querySelector('.badge').className = 'badge ' + status;
      row.querySelector('.badge').textContent = status;
      setTimeout(() => { btn.textContent = 'Save'; btn.disabled = false; }, 1200);
    });
  });
}

['p-q','p-status','p-cat','p-tier','p-trading','p-sort'].forEach(id => {
  $(id).addEventListener('input', renderProspects);
  $(id).addEventListener('change', renderProspects);
});

// ── ROW INTERACTIONS ────────────────────────────────────────────────────────
function wireRows() {
  document.querySelectorAll('.row').forEach(row => {
    const id = row.dataset.id;
    row.querySelector('.row-head').addEventListener('click', () => row.classList.toggle('open'));

    row.querySelector('.js-stage').addEventListener('change', async (e) => {
      await update('contacts', id, { stage: e.target.value });
      await loadAll();
    });

    row.querySelector('.js-save-note').addEventListener('click', async (e) => {
      e.stopPropagation();
      const notes = row.querySelector('.js-notes').value;
      const btn = e.target; btn.textContent = 'Saving…'; btn.disabled = true;
      await update('contacts', id, { notes });
      btn.textContent = 'Saved ✓'; setTimeout(() => { btn.textContent='Save Notes'; btn.disabled=false; }, 1200);
    });

    row.querySelector('.js-add-proj').addEventListener('click', async (e) => {
      e.stopPropagation();
      const title = row.querySelector('.js-p-title').value.trim();
      if (!title) { alert('Give the project a title.'); return; }
      const description = row.querySelector('.js-p-desc').value.trim();
      const valRaw = row.querySelector('.js-p-value').value;
      const value = valRaw ? Number(valRaw) : null;
      const { error } = await sb.from('projects').insert({ contact_id: id, title, description, value });
      if (error) { alert(error.message); return; }
      await loadAll();
      document.querySelector(`.row[data-id="${id}"]`)?.classList.add('open');
    });

    row.querySelectorAll('.proj').forEach(pr => {
      const pid = pr.dataset.pid;
      pr.querySelector('.js-p-status').addEventListener('change', async (e) => {
        await update('projects', pid, { status: e.target.value });
        await loadAll();
        document.querySelector(`.row[data-id="${id}"]`)?.classList.add('open');
      });
      pr.querySelector('.js-del-proj').addEventListener('click', async () => {
        if (!confirm('Delete this project?')) return;
        await sb.from('projects').delete().eq('id', pid);
        await loadAll();
        document.querySelector(`.row[data-id="${id}"]`)?.classList.add('open');
      });
    });
  });
}

async function update(table, id, patch) {
  const { error } = await sb.from(table).update(patch).eq('id', id);
  if (error) alert(error.message);
}

// ── TABS ────────────────────────────────────────────────────────────────────
$('tabs').addEventListener('click', (e) => {
  const t = e.target.closest('.tab'); if (!t) return;
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  activeView = t.dataset.view || 'contacts';
  if (t.dataset.stage) activeStage = t.dataset.stage;
  render();
});

// ── GO ──────────────────────────────────────────────────────────────────────
initSession();
</script>
